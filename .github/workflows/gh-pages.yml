name: Build and deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:pages
        env:
          # NEXT_PUBLIC_SITE_URL: https://ariaghasemi.github.io/daroonik
          # BASE_PATH: /daroonik   # فقط اگر سایت زیر مسیر است

      - name: Opt out of Jekyll
        run: touch out/.nojekyll

      - name: Publish `out/` to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          keep_files: false
          commit_message: "deploy: static site [skip ci]"
